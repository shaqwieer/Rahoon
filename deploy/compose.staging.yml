# Staging deployment of منصة رهون (demo data, SMS confirmation off by default). See deploy/README.md.
# Run from the repository root:  docker compose -f deploy/compose.staging.yml --env-file deploy/.env up -d --build
name: rahoon

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rahoon
      POSTGRES_USER: rahoon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rahoon -d rahoon"]
      interval: 5s
      timeout: 3s
      retries: 20
    # No published port: only the API reaches the database.

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ConnectionStrings__Rahoon: "Host=postgres;Port=5432;Database=rahoon;Username=rahoon;Password=${POSTGRES_PASSWORD}"
      Security__PiiLookupKey: ${PII_LOOKUP_KEY:?Set PII_LOOKUP_KEY in deploy/.env}
      Web__AllowedOrigins__0: https://${RAHOON_DOMAIN:-rahoon.talentfold.net}
      # false: no SMS is sent and confirmation codes are confirmed automatically. Set true only with a real SMS gateway.
      Auth__SmsConfirmation: ${SMS_CONFIRMATION:-false}
    volumes:
      - apidata:/data

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        API_ORIGIN: http://api:8080
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_ORIGIN: http://api:8080
    ports:
      # Loopback only: nginx on the host terminates TLS and proxies to it.
      - "127.0.0.1:${WEB_PORT:-8095}:3000"

volumes:
  pgdata:
  apidata:
