# /etc/nginx/sites-available/rahoon.talentfold.net  (symlinked into sites-enabled)
# HTTP only: `certbot --nginx -d rahoon.talentfold.net` adds the TLS server block and the redirect.
server {
    listen 80;
    listen [::]:80;
    server_name rahoon.talentfold.net;

    # Documents are limited to 20 MB by the API.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
