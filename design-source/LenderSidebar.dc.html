<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav aria-label="القائمة الرئيسية" style="width:264px;box-sizing:border-box;height:100%;min-height:100%;background:#FFFFFF;border-inline-end:1px solid #CBCAC6;display:flex;flex-direction:column;font-family:'IBM Plex Sans Arabic',sans-serif;color:#151513" dir="rtl">
  <div style="padding:20px 20px 12px"><img src="assets/rahoon-horizontal-full.svg" alt="رهون" style="width:172px;display:block"></div>
  <button aria-haspopup="menu" style="margin:4px 12px 12px;display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid #CBCAC6;border-radius:10px;background:#FAF9F6;text-align:right;cursor:pointer;min-height:52px;font-family:inherit">
    <span style="width:32px;height:32px;border-radius:6px;background:#151513;color:#FFFFFF;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none">أف</span>
    <span style="flex:1;display:flex;flex-direction:column;min-width:0"><strong style="font-size:14px;line-height:20px">مصرف الأفق</strong><span style="font-size:12px;line-height:18px;color:#5E5D58">{{ userRole }}</span></span>
    <span class="ms" aria-hidden="true" style="font-family:'Material Symbols Rounded';font-size:20px;color:#5E5D58">unfold_more</span>
  </button>
  <ul style="list-style:none;margin:0;padding:0 12px;display:flex;flex-direction:column;gap:2px">
    <sc-for list="{{ items }}" as="i" hint-placeholder-count="6">
      <li><a href="#" aria-current="{{ i.current }}" style="{{ i.style }}"><span aria-hidden="true" style="font-family:'Material Symbols Rounded';font-size:20px;line-height:1;font-feature-settings:'liga'">{{ i.icon }}</span><span style="flex:1">{{ i.label }}</span><span style="{{ i.badgeStyle }}">{{ i.badge }}</span></a></li>
    </sc-for>
  </ul>
  <div style="margin-top:auto;padding:12px;border-top:1px solid #EDECE8;display:flex;flex-direction:column;gap:2px">
    <a href="#" style="display:flex;gap:12px;align-items:center;min-height:40px;padding:0 12px;border-radius:6px;color:#22262A;text-decoration:none;font-size:14px"><span aria-hidden="true" style="font-family:'Material Symbols Rounded';font-size:20px;line-height:1">help</span>المساعدة والدعم</a>
    <div style="display:flex;gap:10px;align-items:center;padding:10px 12px">
      <span style="width:32px;height:32px;border-radius:50%;background:#F2F1ED;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700">{{ initials }}</span>
      <span style="display:flex;flex-direction:column"><strong style="font-size:13px;line-height:18px">{{ userName }}</strong><span style="font-size:12px;line-height:18px;color:#5E5D58">جلسة آمنة · MFA</span></span>
    </div>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:264,&quot;height&quot;:900},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;intake&quot;,&quot;portfolio&quot;,&quot;cases&quot;,&quot;tasks&quot;,&quot;approvals&quot;,&quot;complaints&quot;,&quot;reports&quot;,&quot;none&quot;],&quot;default&quot;:&quot;portfolio&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;userName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;سارة القحطاني&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;userRole&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;مديرة حالات&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;initials&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;س ق&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;approvals&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;intake&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;5&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'intake';
    const defs = [['intake','الطلبات الواردة','move_to_inbox',this.props.intake ?? '5'],['portfolio','المحفظة','dashboard',''],['cases','الحالات','folder_open',''],['tasks','مهامي','task_alt','7'],['approvals','الموافقات','approval',this.props.approvals ?? ''],['complaints','الشكاوى','support_agent','2'],['reports','التقارير','bar_chart','']];
    return {
      userName: this.props.userName ?? 'سارة القحطاني',
      userRole: this.props.userRole ?? 'مديرة حالات',
      initials: this.props.initials ?? 'س ق',
      items: defs.map(([k,label,icon,badge]) => ({ label, icon, badge, current: k === active ? 'page' : 'false',
        style: `display:flex;gap:12px;align-items:center;min-height:40px;padding:0 12px;border-radius:6px;text-decoration:none;font-size:14px;font-weight:${k===active?700:500};color:${k===active?'#8E3920':'#22262A'};background:${k===active?'#FDF0EB':'transparent'};box-shadow:${k===active?'inset -3px 0 0 #F4633A':'none'}`,
        badgeStyle: badge ? 'font-size:12px;font-weight:600;padding:0 7px;border-radius:999px;background:#151513;color:#FFFFFF;line-height:20px' : 'display:none' })),
    };
  }
}
</script>
</body>
</html>
