# Local development services for رهون.
# Credentials come from .env (copy .env.example). Nothing here is for production.
services:
  postgres:
    image: postgres:16-alpine
    container_name: rahoon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rahoon}
      POSTGRES_USER: ${POSTGRES_USER:-rahoon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - rahoon-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rahoon} -d ${POSTGRES_DB:-rahoon}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  rahoon-pgdata:
